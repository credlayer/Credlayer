<svg width="720" height="340" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CredLayer terminal demo: analyzing a Solana wallet and returning a reputation score of 842 out of 1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #c9d1d9; }
    .muted { fill: #6e7681; }
    .green { fill: #3fb950; }
    .blue  { fill: #58a6ff; }
    .big   { font-size: 38px; font-weight: 700; }
    .tag   { font-size: 11px; letter-spacing: 1.5px; }

    @keyframes type  { from { width: 0; } to { width: 270px; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes rise  { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fill  { from { width: 0; } to { width: 252px; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    .typing { animation: type 1.6s steps(31) .4s both; }
    .cursor { animation: blink 1s step-end infinite; }
    .r { opacity: 0; animation: rise .4s ease-out forwards; }
    .d1 { animation-delay: 2.4s; }
    .d2 { animation-delay: 3.0s; }
    .d3 { animation-delay: 3.6s; }
    .d4 { animation-delay: 4.3s; }
    .d5 { animation-delay: 4.6s; }
    .d6 { animation-delay: 5.3s; }
    .d7 { animation-delay: 5.6s; }
    .d8 { animation-delay: 5.9s; }
    .d9 { animation-delay: 6.6s; }
    .bar { animation: fill 1.2s ease-out 4.8s both; }
    .dot { animation: pulse 2s ease-in-out 7s infinite; }
  </style>

  <defs>
    <clipPath id="clip"><rect x="44" y="48" height="26" class="typing"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="339" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M1 10.5A9.5 9.5 0 0 1 10.5 1H709.5A9.5 9.5 0 0 1 719 10.5V34H1Z" fill="#161b22"/>
  <line x1="1" y1="34.5" x2="719" y2="34.5" stroke="#30363d"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="38" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="56" cy="18" r="5.5" fill="#28c840"/>
  <text x="360" y="22" text-anchor="middle" class="muted" style="font-size:12px">credlayer</text>

  <text x="24" y="66" class="blue" style="font-weight:700">$</text>
  <g clip-path="url(#clip)">
    <text x="44" y="66">credlayer analyze 7xKXt...4kL9p</text>
  </g>
  <rect x="288" y="53" width="8" height="16" fill="#58a6ff" class="cursor"/>

  <g class="r d1">
    <polyline points="26,96 30,100 37,92" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="100">Fetching on-chain activity</text>
    <text x="696" y="100" text-anchor="end" class="muted">Solana</text>
  </g>
  <g class="r d2">
    <polyline points="26,120 30,124 37,116" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="124">Analyzing behavior patterns</text>
    <text x="696" y="124" text-anchor="end" class="muted">847 signals</text>
  </g>
  <g class="r d3">
    <polyline points="26,144 30,148 37,140" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="148">Running risk detection</text>
    <text x="696" y="148" text-anchor="end" class="muted">1.2s</text>
  </g>

  <line x1="24" y1="170" x2="696" y2="170" stroke="#21262d" class="r d4"/>

  <g class="r d5">
    <text x="24" y="196" class="muted tag">REPUTATION SCORE</text>
    <text x="24" y="238" class="big green">842</text>
    <text x="100" y="238" class="muted" style="font-size:16px">/ 1000</text>
  </g>
  <rect x="24" y="256" width="252" height="6" rx="3" fill="#21262d"/>
  <rect x="24" y="256" height="6" rx="3" fill="#3fb950" class="bar"/>

  <g class="r d6">
    <text x="400" y="214" class="muted">Risk</text>
    <text x="520" y="214" class="green" style="font-weight:700">LOW</text>
  </g>
  <g class="r d7">
    <text x="400" y="238" class="muted">Confidence</text>
    <text x="520" y="238" class="blue">91%</text>
  </g>
  <g class="r d8">
    <text x="400" y="262" class="muted">Network</text>
    <text x="520" y="262" class="blue">solana</text>
  </g>

  <g class="r d9">
    <line x1="24" y1="288" x2="696" y2="288" stroke="#21262d"/>
    <circle cx="30" cy="311" r="4" fill="#3fb950" class="dot"/>
    <text x="44" y="315" class="green">online</text>
    <text x="696" y="315" text-anchor="end" class="muted" style="font-style:italic">Trust the behavior. Verify the reputation.</text>
  </g>
</svg>
